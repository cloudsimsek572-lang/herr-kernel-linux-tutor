<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herr Kernel - Linux Academy v3.2</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: black; color: #10b981; font-family: monospace; overflow: hidden; }
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #064e3b; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const PENGUIN_ASCII = `
          .---.
         /     \\
        (  o o  )
        |   V   |
       / \\     / \\
      (   '._.'   )
       \\__/_\\__/
         [===]
        `;

        // ---------- Highscore-Rangliste (gespeichert im localStorage) ----------
        const LEADERBOARD_KEY = 'herrKernel.leaderboard';
        const LEADERBOARD_SIZE = 10;
        const MEDALS = ['🥇', '🥈', '🥉'];

        const loadLeaderboard = () => {
            try {
                const data = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
                return Array.isArray(data) ? data : [];
            } catch {
                return [];
            }
        };

        // Trägt den Score ein, falls er der neue persönliche Bestwert ist.
        // Pro Name gibt es nur einen Eintrag (Groß-/Kleinschreibung egal).
        const submitScore = (name, score) => {
            const list = loadLeaderboard();
            const key = name.trim().toLowerCase();
            const existing = list.find(e => e.name.toLowerCase() === key);
            if (existing) {
                if (score <= existing.score) return list;
                existing.score = score;
                existing.date = new Date().toISOString();
            } else {
                list.push({ name: name.trim(), score, date: new Date().toISOString() });
            }
            const ranked = list.sort((a, b) => b.score - a.score).slice(0, LEADERBOARD_SIZE);
            try { localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(ranked)); } catch {}
            return ranked;
        };

        // Rangliste als Text-Tabelle für das Terminal (Befehl: "top")
        const formatLeaderboard = (list, currentName) => {
            if (list.length === 0) return "RANGLISTE: Noch keine Einträge. Löse eine Prüfung mit [1]!";
            const me = currentName.trim().toLowerCase();
            const rows = list.map((e, i) => {
                const rank = String(i + 1).padStart(2, ' ');
                const name = e.name.slice(0, 12).padEnd(12, ' ');
                const pts = String(e.score).padStart(6, ' ');
                const marker = e.name.toLowerCase() === me ? ' ◄ DU' : '';
                return ` ${rank}. ${name} ${pts} PTS${marker}`;
            });
            return ["╔═══════ RANGLISTE ═══════╗", ...rows, "╚═════════════════════════╝"].join("\n");
        };

        const Sidebar = ({ isOpen, onClose, leaderboard, currentScore, username }) => {
            const me = username.trim().toLowerCase();
            const myEntry = leaderboard.find(e => e.name.toLowerCase() === me);
            return (
                <div className={`fixed inset-y-0 left-0 z-50 w-64 bg-zinc-950 border-r border-zinc-800 transform ${isOpen ? 'translate-x-0' : '-translate-x-full'} transition-transform duration-300 p-4 overflow-y-auto terminal-scroll`}>
                    <button onClick={onClose} className="text-emerald-500 mb-4">✕ Schließen</button>
                    <h2 className="text-white font-bold mb-2">LEADERBOARD</h2>
                    <div className="text-xs text-zinc-400">Aktuell: <span className="text-amber-500">{currentScore} PTS</span></div>
                    <div className="text-xs text-zinc-400 mb-4">Dein Highscore: <span className="text-amber-500">{myEntry ? myEntry.score : 0} PTS</span></div>
                    {leaderboard.length === 0 ? (
                        <div className="text-[11px] text-emerald-700">Noch keine Einträge</div>
                    ) : (
                        <ol className="text-xs space-y-1">
                            {leaderboard.map((e, i) => {
                                const isMe = e.name.toLowerCase() === me;
                                return (
                                    <li key={e.name} className={`flex justify-between px-2 py-1 rounded ${isMe ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'text-zinc-300'}`}>
                                        <span className="truncate mr-2">{MEDALS[i] || `${i + 1}.`} {e.name}</span>
                                        <span className="text-amber-500 tabular-nums">{e.score}</span>
                                    </li>
                                );
                            })}
                        </ol>
                    )}
                    <div className="text-[10px] text-zinc-600 mt-4">Tipp: Tippe "top" im Terminal.</div>
                </div>
            );
        };

        const App = () => {
            const [username, setUsername] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [history, setHistory] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [lives, setLives] = useState(3.0);
            const [score, setScore] = useState(0);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [leaderboard, setLeaderboard] = useState(loadLeaderboard);

            // Neuen Highscore automatisch in die Rangliste eintragen
            useEffect(() => {
                if (isLoggedIn && score > 0) setLeaderboard(submitScore(username, score));
            }, [score, isLoggedIn, username]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (username.trim()) {
                    setIsLoggedIn(true);
                    setHistory([{ type: 'system', content: PENGUIN_ASCII + "\nGuten Tag, " + username.toUpperCase() + ".\nWähle [1] für Training, \"top\" für die Rangliste." }]);
                }
            };

            const handleCommand = (e) => {
                e.preventDefault();
                const cmd = inputValue.trim().toLowerCase();
                let response = "";

                // Know-how Datenbank für die Prüfung
                const labs = [
                    { q: "Wie änderst du Rechte auf '755'?", a: "chmod 755" },
                    { q: "Befehl zum Stoppen eines Dienstes?", a: "systemctl stop" },
                    { q: "Wie beendest du Prozess 1234 sofort?", a: "kill -9 1234" },
                    { q: "Besitzer einer Datei auf 'admin' ändern?", a: "chown admin" },
                    { q: "Wie hängst du Text an eine Logdatei an?", a: ">>" }
                ];

                if (cmd === '1') {
                    // Wählt eine zufällige Prüfungsfrage aus
                    const randomLab = labs[Math.floor(Math.random() * labs.length)];
                    response = "PRÜFUNG: " + randomLab.q;
                    window.currentAnswer = randomLab.a; // Merkt sich die Antwort kurzzeitig
                } else if (window.currentAnswer && cmd.includes(window.currentAnswer)) {
                    setScore(s => s + 200);
                    response = "[PASS] Beeindruckend. Du hast das System verstanden.";
                    window.currentAnswer = null;
                } else if (cmd === 'top' || cmd === 'rangliste') {
                    response = formatLeaderboard(leaderboard, username);
                } else if (cmd === 'help') {
                    setLives(l => l - 0.5);
                    response = "[FAIL] Hilfe? In der Prüfung bist du auf dich allein gestellt! (-0.5 Leben)";
                } else {
                    response = "Analysiere... Befehl nicht korrekt oder unbekannt. Versuch es erneut!";
                }

                setHistory(prev => [...prev, { type: 'user', content: cmd }, { type: 'teacher', content: response }]);
                setInputValue('');
            };
            const hearts = "❤️".repeat(Math.floor(lives)) + (lives % 1 !== 0 ? "💔" : "");

            if (!isLoggedIn) {
                return (
                    <div className="flex items-center justify-center h-screen bg-black">
                        <form onSubmit={handleLogin} className="p-8 border border-zinc-800 bg-zinc-950 rounded">
                            <pre className="text-emerald-500 text-[10px] mb-4">{PENGUIN_ASCII}</pre>
                            <input 
                                className="w-full bg-black border border-zinc-800 p-2 text-emerald-500 mb-4 outline-none" 
                                placeholder="Username" 
                                value={username} 
                                onChange={e => setUsername(e.target.value)}
                            />
                            <button className="w-full bg-emerald-600 text-black font-bold py-2">LOGIN</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col p-4">
                    <Sidebar isOpen={isSidebarOpen} onClose={() => setIsSidebarOpen(false)} leaderboard={leaderboard} currentScore={score} username={username} />
                    <header className="flex justify-between items-center border-b border-zinc-800 pb-2">
                        <button onClick={() => setIsSidebarOpen(true)}>☰</button>
                        <div className="text-xs text-right">
                            <div>{hearts}</div>
                            <div className="text-amber-500 font-bold">{score} PTS</div>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto terminal-scroll py-4 whitespace-pre-wrap">
                        {history.map((m, i) => (
                            <div key={i} className={m.type === 'user' ? "text-blue-400" : "text-emerald-500"}>
                                {m.type === 'user' ? `> ${m.content}` : m.content}
                            </div>
                        ))}
                    </div>
                    <form onSubmit={handleCommand} className="flex border-t border-zinc-800 pt-2">
                        <span className="text-emerald-800 mr-2">root@kernel:~#</span>
                        <input 
                            className="bg-transparent outline-none flex-1 text-white" 
                            value={inputValue} 
                            onChange={e => setInputValue(e.target.value)}
                            autoFocus
                        />
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
